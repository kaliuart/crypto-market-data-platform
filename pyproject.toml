[project]
name = "crypto-market-data-platform"
version = "0.1.0"
description = "Real-time crypto market data pipeline"
requires-python = ">=3.11"
dependencies = [
    "aiokafka",
    "clickhouse-connect",
    "jsonschema",
    "prometheus-client",
    "websockets",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]